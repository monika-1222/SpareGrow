<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#00111d" />
    <title>SpareGrow</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,opsz,GRAD@100..700,0..1,20..48,-50..200&display=swap" rel="stylesheet"/>
    <style>
      body { margin: 0; padding: 0; background-color: #00111d; color: #ffffff; overflow-x: hidden; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
      @keyframes pulseGlow { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.06); opacity: 1; } }
      @keyframes barSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body class="bg-[#00111d] text-white">
    <div id="root">
      <!-- Instant First-Frame Splash (Never a blank screen) -->
      <div style="min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:48px 24px 36px;background-color:#00111d;box-sizing:border-box;">
        <div style="height:20px;"></div>
        <div style="display:flex;flex-direction:column;align-items:center;animation:pulseGlow 2.5s infinite ease-in-out;">
          <div style="width:88px;height:88px;border-radius:24px;background:linear-gradient(135deg,#00342b,#10b981);display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(16,185,129,0.35);margin-bottom:20px;">
            <span style="font-size:42px;">🌱</span>
          </div>
          <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.5px;margin:0 0 8px 0;color:#ffffff;">SpareGrow</h1>
          <p style="font-size:14px;color:#94d3c1;margin:0;font-weight:500;letter-spacing:0.2px;">Save Small. Grow Big.</p>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:200px;">
          <div style="width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;position:relative;">
            <div style="width:40%;height:100%;background:#10b981;border-radius:99px;animation:barSlide 1.2s infinite ease-in-out;"></div>
          </div>
          <span style="font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:1px;text-transform:uppercase;font-weight:600;">Loading Experience...</span>
        </div>
      </div>
    </div>
    <script>
      // Global fail-safe: Ensure any uncaught error is logged and doesn't freeze the app
      window.onerror = function(msg, url, line) {
        console.error('SpareGrow Global Catch:', msg, 'at', url, line);
      };
      window.onunhandledrejection = function(e) {
        console.error('SpareGrow Unhandled Rejection:', e.reason);
      };
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
